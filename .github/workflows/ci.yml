name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# main/master 上的 run 跑完才算绿；PR 上的 run 可以被新的 push 取消，
# 避免排队积压（此规则的由来见 LESSONS.md 的发布纪律一节）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
